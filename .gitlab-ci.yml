stages:
  - lint
  - build
  - test
  - benchmark
  - prepare-release
  - build-release
  - release

variables:
  KUZU_VERSION: "0.11.1"
  GITLAB_XTASKS_VERSION: "1.3.0"
  MISE_AUTO_INSTALL: "false"
  GCLOUD_PROJECT: gitlab-ci-runners-signing
  SERVICE_ACCOUNT: gitlab-knowledge-graph-signer@gitlab-ci-runners-signing.iam.gserviceaccount.com
  WI_POOL_PROVIDER: //iam.googleapis.com/projects/8522242139/locations/global/workloadIdentityPools/gitlab-pool-oidc-$CI_PROJECT_ID/providers/gitlab-jwt-$CI_PROJECT_ID

include:
  - component: ${CI_SERVER_FQDN}/gitlab-org/components/danger-review/danger-review@2.1.0
  - project: "gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules"
    ref: 3.3.0
    file: templates/gcp_auth.yaml

.install-gitlab-xtasks: &install-gitlab-xtasks |
  cargo install --git https://gitlab.com/gitlab-org/rust/gitlab-xtasks --tag v${GITLAB_XTASKS_VERSION} --force

.install-mise: &install-mise |
  if ! command -v mise >/dev/null 2>&1; then
    echo "Installing mise..."
    curl https://mise.run | sh
    export PATH="$HOME/.local/bin:$PATH"
  fi
  mise --version

.rust-job-template:
  tags:
    - saas-linux-large-amd64
  image: registry.gitlab.com/gitlab-org/rust/build-images/rust-kuzu:1.89.0-${KUZU_VERSION}-linux-x86_64
  before_script:
    - rustup set auto-self-update disable

danger-review:
  stage: lint
  needs: []
  before_script:
    - bundle init
    - bundle add gitlab-dangerfiles

mr-title-check:
  image: ${GITLAB_DEPENDENCY_PROXY}node:lts-alpine
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - npm install -g @commitlint/cli @commitlint/config-conventional
  script:
    - ./scripts/check-mr-title.sh

rust-fmt-check:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *install-mise
    - rustup component add --toolchain stable-x86_64-unknown-linux-gnu rustfmt
  script:
    - mise run rust-fmt
  extends: .rust-job-template

rust-lint-check:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *install-mise
    - rustup component add --toolchain stable-x86_64-unknown-linux-gnu clippy
  script:
    - mise run rust-clippy
  extends: .rust-job-template

xtasks-verify-newlines:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  before_script:
    - *install-gitlab-xtasks
    - *install-mise
  script:
    - mise run newlines-check
  extends: .rust-job-template

frontend-build:
  stage: build
  image: node:22.17.0
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npm run build --workspace=@gitlab-org/gkg-frontend
    - npm run build --workspace=@gitlab-org/gkg
  artifacts:
    paths:
      - packages/frontend/dist/
    expire_in: 24 hours

.docs-build-template:
  stage: build
  image: node:22.17.0
  needs: []
  variables:
    npm_config_cache: "${CI_PROJECT_DIR}/.npm"
  before_script:
    - npm ci
    - *install-mise
    - mise run docs-lint
  script:
    - npm run build --workspace=docs
    - echo "Pages accessible through ${CI_PAGES_URL}"

# Workaround to not expire gitlab pages for main branch
# but keep the expiration for other branches on merge requests
docs-build:main:
  extends: .docs-build-template
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    PAGES_PREFIX: ""
  pages:
    path_prefix: "$PAGES_PREFIX"
    expire_in: never
    publish: packages/docs/dist
  artifacts:
    paths:
      - packages/docs/dist/
    expire_in: never
  environment:
    name: "Docs"
    url: $CI_PAGES_URL

docs-build:preview:
  extends: .docs-build-template
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    PAGES_PREFIX: "$CI_COMMIT_REF_SLUG"
  pages:
    path_prefix: "$PAGES_PREFIX"
    expire_in: 1 week
    publish: packages/docs/dist
  artifacts:
    paths:
      - packages/docs/dist/
    expire_in: 1 week
  environment:
    name: "Docs ${PAGES_PREFIX}"
    url: $CI_PAGES_URL

docs-comment:
  tags:
    - saas-linux-medium-amd64
  stage: build
  needs:
    - docs-build:preview
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  variables:
    PAGES_PREFIX: "$CI_COMMIT_REF_SLUG"
  script:
    - *install-gitlab-xtasks
    - |
      # Construct the docs URL based on the branch
      DOCS_URL="${CI_PAGES_URL}/${PAGES_PREFIX}"

      # Create markdown comment content
      cat > docs-ready-comment.md << EOF
      ## 📚 Documentation Preview Ready

      The documentation for this merge request has been built and deployed.

      **📖 View Documentation:** [${DOCS_URL}](${DOCS_URL})

      This preview will be available until the merge request is closed or merged.
      EOF

      # Post the comment
      gitlab-xtasks comment post \
        --type add-or-edit \
        --unique-id "docs-preview-comment" \
        --file-path docs-ready-comment.md

      echo "Documentation preview comment posted successfully"
      echo "Documentation available at: ${DOCS_URL}"
  extends: .rust-job-template

rust-unit-test-report:
  stage: test
  needs:
    - frontend-build
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    RUST_BACKTRACE: 1
  before_script:
    - *install-mise
  script:
    - mise run rust-test
  extends: .rust-job-template
  artifacts:
    when: always
    reports:
      junit:
        - target/nextest/ci/junit.xml

# Shared benchmark template for GKG indexing performance tests
.gkg-benchmark-template:
  stage: benchmark
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  script:
    - export CARGO_INSTALL_ROOT="${CARGO_HOME:-$HOME/.cargo}"
    - export PATH="${CARGO_INSTALL_ROOT}/bin:$HOME/.cargo/bin:$PATH"
    - *install-gitlab-xtasks
    - |
      # Debug: Show where gitlab-xtasks was installed
      which gitlab-xtasks || echo "gitlab-xtasks not found in PATH"
      echo "Current PATH: $PATH"

      # Platform-specific setup
      if [[ "$RUNNER_OS" == "macOS" ]]; then
        # rustup will automatically use the version from rust-toolchain.toml
        # Install hyperfine via Homebrew (recommended method)
        brew install hyperfine 2>/dev/null || echo "hyperfine may already be installed"
      else
        cargo install --locked hyperfine
      fi
      # Build gkg with no-frontend feature before running the benchmark
      cargo build --bin gkg --release --features no-frontend
      # Run benchmark with unique filename
      OUTPUT_FILE="gkg-benchmark-${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}-${ARCH}-${SCENARIO}.json"
      gitlab-xtasks benchmark hyperfine \
        --config gkg-benchmark-config.toml \
        --architecture "$ARCH" \
        --scenario "$SCENARIO" \
        --output-file "$OUTPUT_FILE"
      echo "GKG benchmark completed for scenario: $SCENARIO on architecture: $ARCH"
  artifacts:
    paths:
      - gkg-benchmark-*.json
    expire_in: 3 weeks

# Linux GKG benchmark execution
gkg-benchmark-linux:
  extends:
    - .rust-job-template
    - .gkg-benchmark-template
  variables:
    ARCH: "linux-x86_64"
    CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  parallel:
    matrix:
      - SCENARIO: [gkg_index_gdk_release_4_threads]

gkg-benchmark-macos:
  extends: .gkg-benchmark-template
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  variables:
    ARCH: "macos-arm64"
    RUNNER_OS: "macOS"
  before_script:
    - source ./scripts/macos-kuzu-install.sh
    - rustc --version && cargo --version
    - rustup set auto-self-update disable
  parallel:
    matrix:
      - SCENARIO: [gkg_index_gdk_release_4_threads]

# Collect and analyze all GKG benchmark results
gkg-benchmark-analyze:
  stage: benchmark
  needs:
    - gkg-benchmark-linux
    - gkg-benchmark-macos
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  interruptible: true
  script:
    - *install-gitlab-xtasks
    - |
      # Generate markdown report with metadata
      gitlab-xtasks benchmark analyze \
        --pattern "gkg-benchmark-*.json" \
        --output-format markdown \
        --pipeline-url "$CI_PIPELINE_URL" \
        --job-url "$CI_JOB_URL" \
        --branch "$CI_COMMIT_REF_NAME" \
        --output-file gkg-benchmark-results.md

      # Generate JSON report with metadata  
      gitlab-xtasks benchmark analyze \
        --pattern "gkg-benchmark-*.json" \
        --output-format json \
        --pipeline-url "$CI_PIPELINE_URL" \
        --job-url "$CI_JOB_URL" \
        --branch "$CI_COMMIT_REF_NAME" \
        --output-file gkg-benchmark-results.json

      echo "Generated GKG benchmark reports:"
      echo "- Markdown: gkg-benchmark-results.md"
      echo "- JSON: gkg-benchmark-results.json"

      # Post benchmark results as MR comment using add-or-edit strategy
      if [[ -n "$CI_MERGE_REQUEST_IID" ]]; then
        echo "Posting GKG benchmark results to MR !$CI_MERGE_REQUEST_IID..."
        gitlab-xtasks comment post \
          --type add-or-edit \
          --unique-id "gkg-benchmarking-comment" \
          --file-path gkg-benchmark-results.md
        echo "GKG benchmark comment posted successfully"
      else
        echo "Not a merge request pipeline, skipping comment posting"
      fi
  artifacts:
    paths:
      - gkg-benchmark-results.md
      - gkg-benchmark-results.json
      - gkg-benchmark-*.json
    expire_in: 1 week
  extends: .rust-job-template

start-release:
  when: manual
  allow_failure: false
  image: node:22.17.0
  stage: prepare-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm ci
    - npm run semantic-release -- --dry-run
  artifacts:
    paths:
      - .VERSION
    expire_in: 7 days

cargo-update:
  stage: build-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - start-release
  extends: .rust-job-template
  script:
    - cargo install cargo-edit
    - cargo set-version $(cat .VERSION)
    - |
      tar -czf cargo-files.tar.gz \
        Cargo.toml \
        Cargo.lock \
        crates/*/Cargo.toml
  artifacts:
    paths:
      - cargo-files.tar.gz
    expire_in: 7 days

.linux-build-template:
  image: rust:1.88.0-bookworm
  stage: build-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - frontend-build
    - cargo-update
  before_script:
    - tar -xzf cargo-files.tar.gz
  script:
    - apt-get update && apt-get install -y build-essential cmake gcc g++ python3 libclang-dev
    - rustup target add ${ARCH}-unknown-linux-gnu
    - ./scripts/build.sh
    - BIN_NAME=http-server-deployed ./scripts/build.sh
  variables:
    PLATFORM: Linux
  artifacts:
    paths:
      - ./gkg-linux-${ARCH}.tar.gz
      - ./gkg-server-${ARCH}.tar.gz
    expire_in: 7 days

.darwin-build-template:
  image: macos-15-xcode-16
  tags:
    - saas-macos-medium-m1
  stage: build-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - frontend-build
    - cargo-update
  before_script:
    - tar -xzf cargo-files.tar.gz
  script:
    - brew install cmake python jq
    - rustup target add ${ARCH}-apple-darwin
    - ./scripts/build.sh
  variables:
    PLATFORM: Darwin
  artifacts:
    paths:
      - ./gkg-darwin-${ARCH}.tar.gz
    expire_in: 7 days

build:linux-aarch64-gnu:
  extends: .linux-build-template
  tags:
    - saas-linux-large-arm64
  variables:
    ARCH: aarch64

build:linux-x86_64-gnu:
  extends: .linux-build-template
  tags:
    - saas-linux-large-amd64
  variables:
    ARCH: x86_64

build:darwin-aarch64:
  extends: .darwin-build-template
  variables:
    ARCH: aarch64

build:darwin-x86_64:
  extends: .darwin-build-template
  variables:
    ARCH: x86_64

build:windows-x86_64:
  tags:
    - saas-windows-medium-amd64
  stage: build-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - frontend-build
    - cargo-update
  before_script:
    - '.\scripts\windows-prepare.ps1 ${KUZU_VERSION}'
    - tar -xzf cargo-files.tar.gz
  script:
    - cargo build --release --bin gkg --locked
    - Copy-Item -Path C:\install\libkuzu\*.dll -Destination target\release\
    - tar -czvf gkg-windows-x86_64.tar.gz -C target/release gkg.exe *.dll
  artifacts:
    paths:
      - ./gkg-windows-x86_64.tar.gz
    expire_in: 7 days
  timeout: 2h

build:code-sign:
  image: ${CI_REGISTRY}/gitlab-com/gl-infra/common-ci-tasks-images/code-signer:1.1.0
  extends: .google-oidc:auth
  stage: build-release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:windows-x86_64
    - build:darwin-aarch64
    - build:darwin-x86_64
  script:
    - |
      if [[ "$CI_SERVER_HOST" == "gitlab.com" &&
            "$CI_PROJECT_PATH" == "gitlab-org/rust/knowledge-graph" &&
            "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        echo "Signing binaries..."
        ./scripts/sign-and-repackage.sh ./gkg-windows-x86_64.tar.gz windows
        ./scripts/sign-and-repackage.sh ./gkg-darwin-aarch64.tar.gz macos
        ./scripts/sign-and-repackage.sh ./gkg-darwin-x86_64.tar.gz macos
      else
        echo "Not signing binaries"
      fi
  artifacts:
    paths:
      - ./gkg-windows-x86_64.tar.gz
      - ./gkg-darwin-aarch64.tar.gz
      - ./gkg-darwin-x86_64.tar.gz
    expire_in: 7 days
  timeout: 2h

release:
  image: registry.gitlab.com/gitlab-org/editor-extensions/build-images/node-codesign:22.14.0
  stage: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build:linux-aarch64-gnu
    - build:linux-x86_64-gnu
    - build:code-sign
    - cargo-update
  before_script:
    # Use the new Cargo.lock from cargo-update step
    - tar -xzf cargo-files.tar.gz
    # Validate that the repository contains a package.json and extract a few values from it.
    - |
      if [[ ! -f package.json ]]; then
        echo "No package.json found! A package.json file is required to publish a package to GitLab's NPM registry."
        echo 'For more information, see https://docs.gitlab.com/ee/user/packages/npm_registry/#creating-a-project'
        exit 1
      fi
    - NPM_PACKAGE_NAME=$(node -p "require('./package.json').name")
    # Validate that the package name is properly scoped to the project's root namespace.
    # For more information, see https://docs.gitlab.com/user/packages/npm_registry/#naming-convention
    - |
      if [[ ! $NPM_PACKAGE_NAME =~ ^@$CI_PROJECT_ROOT_NAMESPACE/ ]]; then
        echo "Invalid package scope! Packages must be scoped in the root namespace of the project, e.g. \"@${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}\""
        echo 'For more information, see https://docs.gitlab.com/user/packages/npm_registry/#naming-convention'
        exit 1
      fi
  script:
    - npm ci
    # Generate SHA256 checksums for all binaries
    - for file in *.tar.gz; do if [ -f "$file" ]; then sha256sum "$file" > "${file}.sha256"; fi; done
    - npm run semantic-release
  allow_failure: false
